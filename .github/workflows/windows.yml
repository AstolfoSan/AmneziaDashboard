name: Windows setup
on:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r installer/requirements.txt -r installer/requirements-build.txt -r installer/portable/app/requirements.txt
      - run: python tools/check.py
      - run: python tools/build_source.py --output dist
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-setup
          path: dist/*
          if-no-files-found: error
          retention-days: 7
