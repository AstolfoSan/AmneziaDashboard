name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require tag, VERSION and installer version to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib; assert os.environ['RELEASE_TAG']=='v'+pathlib.Path('VERSION').read_text().strip()"
      - run: python -m pip install -r installer/requirements.txt -r installer/requirements-build.txt -r installer/portable/app/requirements.txt
      - run: python tools/check.py
      - run: python tools/build_source.py --output dist
      - run: python tools/build_windows.py
      - name: Prepare a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" --verify-tag --draft --title "AmneziaDashboard $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md dist/AmneziaDashboard.zip dist/AmneziaDashboardSetup.exe dist/Windows-licenses.zip dist/SHA256SUMS
