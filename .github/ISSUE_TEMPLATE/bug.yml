name: Bug report / Ошибка
description: Report a reproducible problem without private deployment data.
body:
  - type: markdown
    attributes:
      value: "Do not post keys, passwords, real server IPs, .vpn files, databases or invitation URLs. Не публикуйте личные данные и рабочие конфиги."
  - type: input
    id: version
    attributes:
      label: Version / Версия
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode / Режим
      options: [Direct, Cascade, Portable panel component]
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual result / Шаги и результат
      description: Use synthetic addresses and remove all private identifiers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Приватность
      options:
        - label: I removed private keys, passwords, addresses and issued profiles.
          required: true
